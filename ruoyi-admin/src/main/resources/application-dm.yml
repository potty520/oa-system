spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://${DB_HOST:localhost}:${DB_PORT:5236}/${DB_NAME:OA_SYSTEM}
    username: ${DB_USERNAME:SYSDBA}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      encoding: UTF-8
      # DM 的 DDL 同样没有 IF NOT EXISTS / IF OBJECT_ID 这类守卫，db/dm/schema.sql 里的
      # 28 条 CREATE TABLE、22 条 CREATE INDEX 都是无条件的，第二次启动必然报"对象已存在"。
      # 所以这里必须容忍这一错误，改成 false 会让重复启动直接失败；种子的 MERGE 语句本身幂等。
      # 代价是真正的错误也会被吞掉，只保留"脚本不含 DROP/TRUNCATE/DELETE"这条底线。
      continue-on-error: true
      schema-locations: classpath:db/dm/schema.sql