spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://${DB_HOST:localhost}:${DB_PORT:5236}/${DB_NAME:OA_SYSTEM}
    username: ${DB_USERNAME:SYSDBA}
    password: ${DB_PASSWORD:SYSDBA}
  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      encoding: UTF-8
      continue-on-error: true
      schema-locations: classpath:db/dm/schema.sql