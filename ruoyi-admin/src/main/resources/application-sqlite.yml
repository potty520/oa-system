spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.sqlite.JDBC
    url: "jdbc:sqlite:${SQLITE_DB_PATH:./oa-system-local.db}?date_class=text&date_string_format=yyyy-MM-dd HH:mm:ss"
    username:
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/sqlite/schema.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl