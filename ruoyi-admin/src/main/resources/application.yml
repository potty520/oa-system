app:
  upload:
    path: ${UPLOAD_PATH:./oa-upload}
  # 未配置 OA_INIT_<用户名大写>_PASSWORD 时，生成的一次性初始口令只写入这个本地文件，不再写入日志
  init-password-file: ${INIT_PASSWORD_FILE:./oa-init-passwords.txt}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:18081}
  security:
    public-api-docs: ${PUBLIC_API_DOCS:false}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}

server:
  port: 8080

spring:
  profiles:
    default: mysql
  application:
    name: oa-system
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/oa_system?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=${DB_USE_SSL:false}&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: root
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.oa.**.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 2
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

pagehelper:
  auto-runtime-dialect: true
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
