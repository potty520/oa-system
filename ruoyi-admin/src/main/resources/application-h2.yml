spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${H2_DB_PATH:./oa-system-h2};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      encoding: UTF-8
      schema-locations: classpath:db/h2/schema.sql