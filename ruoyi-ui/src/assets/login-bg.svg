<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="OA 办公系统登录页背景">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef8fe"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f8fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0ea5e9" opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#dots)" opacity="0.5"/>

  <!-- 柔和极光色块：低饱和，避免干扰居中的白色登录卡 -->
  <g filter="url(#soft)">
    <circle cx="150" cy="120" r="260" fill="#0ea5e9" opacity="0.22"/>
    <circle cx="1470" cy="140" r="240" fill="#7dd3fc" opacity="0.34"/>
    <circle cx="1390" cy="890" r="300" fill="#0ea5e9" opacity="0.16"/>
    <circle cx="170" cy="910" r="230" fill="#f43f5e" opacity="0.08"/>
  </g>

  <!-- 漂浮的「公文卡片」装饰 -->
  <g>
    <g transform="rotate(-8 1255 425)">
      <rect x="1090" y="300" width="330" height="250" rx="20" fill="url(#card)" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="1124" y="344" width="152" height="14" rx="7" fill="#0ea5e9" opacity="0.85"/>
      <rect x="1124" y="380" width="240" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="1124" y="406" width="212" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="1124" y="432" width="176" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="1124" y="480" width="88" height="28" rx="14" fill="#e0f2fe"/>
    </g>

    <g transform="rotate(7 245 640)">
      <rect x="90" y="520" width="300" height="230" rx="20" fill="url(#card)" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="142" cy="574" r="16" fill="url(#accent)"/>
      <rect x="176" y="564" width="168" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="176" y="586" width="128" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="124" y="630" width="234" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="124" y="656" width="198" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="124" y="682" width="148" height="10" rx="5" fill="#e2e8f0"/>
    </g>

    <!-- 强调色徽标：点睛 -->
    <g transform="translate(1128 806)">
      <circle cx="0" cy="0" r="30" fill="#f43f5e" opacity="0.16"/>
      <circle cx="0" cy="0" r="20" fill="#f43f5e" opacity="0.9"/>
      <path d="M-8 0 l6 6 l11 -12" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(556 176)">
      <circle cx="0" cy="0" r="16" fill="#0ea5e9" opacity="0.35"/>
      <circle cx="0" cy="0" r="7" fill="#0ea5e9" opacity="0.7"/>
    </g>
    <g transform="translate(1348 636)">
      <circle cx="0" cy="0" r="12" fill="#38bdf8" opacity="0.45"/>
    </g>
  </g>
</svg>
