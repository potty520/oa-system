name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload boot jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: oa-system-jar
          path: ruoyi-admin/target/*.jar
          retention-days: 14
          if-no-files-found: error

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ruoyi-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ruoyi-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:prod
